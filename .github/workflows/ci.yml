name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  linux-camera:
    name: Linux camera end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - run: echo "PHONECAM_HOME=$RUNNER_TEMP/phonecam" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install v4l2loopback, decoder libraries, ffmpeg
        timeout-minutes: 12
        run: |
          sudo apt-get update
          sudo -E apt-get install -y --no-install-recommends v4l2loopback-dkms "linux-headers-$(uname -r)" "linux-modules-extra-$(uname -r)" v4l-utils \
            libavcodec-dev libswscale-dev libavutil-dev pkg-config ffmpeg
      - name: Create the PhoneCam device (same options as "phonecam setup")
        run: |
          sudo modprobe videodev
          sudo modprobe v4l2loopback devices=1 video_nr=42 card_label="PhoneCam" exclusive_caps=1 max_buffers=2
          sudo chmod 666 /dev/video42
          v4l2-ctl -d /dev/video42 --info
      - run: npm ci
      - name: Build the camera helper
        run: npm run build:helper
      - name: Helper decode test
        run: PHONECAM_HELPER="$PHONECAM_HOME/bin/phonecam-v4l2" npm test
      - name: Phone to camera end-to-end
        timeout-minutes: 3
        run: node test/e2e/linux-camera.mjs
